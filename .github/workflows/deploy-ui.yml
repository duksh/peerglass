name: Deploy Web UI to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "ui/**"
      - ".github/workflows/deploy-ui.yml"
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build React UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        env:
          # Subpath on GitHub Pages: https://duksh.github.io/peerglass/
          VITE_BASE_PATH: /peerglass/
          # Render.com API backend
          VITE_API_BASE_URL: https://peerglass-api.onrender.com
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Smoke Test API Backend
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render cold start and verify API health
        run: |
          echo "Probing https://peerglass-api.onrender.com/v1/meta/status ..."
          for i in $(seq 1 8); do
            STATUS=$(curl -s -o /tmp/api_response.txt -w "%{http_code}" \
              --max-time 20 \
              https://peerglass-api.onrender.com/v1/meta/status || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy."
              cat /tmp/api_response.txt
              exit 0
            fi
            sleep 15
          done
          echo "ERROR: API did not return 200 after 8 attempts (~2 minutes)."
          echo "Last response:"
          cat /tmp/api_response.txt || true
          exit 1
